name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24
          cache: true
      - name: Build and test
        run: pnpm -r test
      - name: Publish
        run: bash .github/scripts/publish.sh packages/sparse-octree
      - name: Deploy pages
        run: pnpm run -r deploy
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          single-commit: true
